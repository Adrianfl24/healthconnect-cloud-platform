name: Build & Deploy to AKS via ACR

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: ["main"]

jobs:
  # 1. BUILD JAVA & TESTS
  build-and-test:
    name: 1. Build Java & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      - name: Compile & Test
        run: mvn clean package -DskipTests --file pom.xml

  # 2. DOCKER BUILD & PUSH TO ACR
  docker-build-acr:
    name: 2. Build & Push to Azure Container Registry
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.ACR_LOGIN_SERVER }}/healthconnect-platform:${{ github.sha }}

  # 3. KUBERNETES DEPLOY
  k8s-deploy:
    name: 3. Deploy to AKS Cluster
    needs: docker-build-acr
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Kubeconfig Context
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Apply K8s Manifests & Update Image
        run: |
          kubectl apply -f k8s/
          kubectl set image deployment/platform-deployment platform-container=${{ secrets.ACR_LOGIN_SERVER }}/healthconnect-platform:${{ github.sha }}
          kubectl rollout status deployment/platform-deployment

      - name: Print Public IP
        run: |
          echo "Adresa aplicatiei pe internet:"
          kubectl get svc platform-service
