<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HealthConnect - Autentificare & Portal Cloud</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      .hero-bg {
        background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%);
        color: white;
        min-height: 100vh;
      }
      .auth-card {
        border: none;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        background: white;
        color: #333;
      }
      .nav-pills .nav-link.active {
        background-color: #0d6efd;
      }
    </style>
  </head>
  <body class="hero-bg d-flex align-items-center py-5">
    <div class="container">
      <div class="row align-items-center g-5">
        <!-- STÂNGA: Prezentare Platformă -->
        <div class="col-lg-6 text-center text-lg-start">
          <h1 class="display-3 fw-bold mb-3">🏥 HealthConnect</h1>
          <p class="lead mb-4">
            Platforma ta cloud pentru servicii medicale și îngrijire la
            domiciliu, conectată în timp real la Azure SQL Database.
          </p>
          <div
            class="d-flex justify-content-center justify-content-lg-start gap-3"
          >
            <span class="badge bg-light text-primary px-3 py-2 fs-6"
              >🔒 Azure Cloud Security</span
            >
            <span class="badge bg-light text-primary px-3 py-2 fs-6"
              >⚡ Spring Boot 3</span
            >
          </div>
        </div>

        <!-- DREAPTA: Cardul Mare de Login / Înregistrare -->
        <div class="col-lg-6">
          <div class="card auth-card p-4 p-md-5">
            <!-- Tab-uri de comutare Login / Register -->
            <ul
              class="nav nav-pills nav-justified mb-4"
              id="authTabs"
              role="tablist"
            >
              <li class="nav-item">
                <button
                  class="nav-link active fw-bold"
                  id="login-tab"
                  data-bs-toggle="pill"
                  data-bs-target="#login-panel"
                >
                  🔑 Autentificare
                </button>
              </li>
              <li class="nav-item">
                <button
                  class="nav-link fw-bold"
                  id="register-tab"
                  data-bs-toggle="pill"
                  data-bs-target="#register-panel"
                >
                  📝 Înregistrare Cont Nou
                </button>
              </li>
            </ul>

            <!-- Mesaj de Eroare (Dacă datele de login sunt greșite) -->
            <div
              th:if="${error}"
              class="alert alert-danger py-2"
              text="${error}"
            >
              Date de autentificare incorecte!
            </div>

            <div class="tab-content" id="authTabsContent">
              <!-- TAB 1: FORMULAR AUTENTIFICARE (LOGIN) -->
              <div class="tab-pane fade show active" id="login-panel">
                <form action="/login" method="post">
                  <div class="mb-3">
                    <label class="form-label fw-semibold"
                      >Nume Utilizator / Email</label
                    >
                    <input
                      type="text"
                      name="username"
                      class="form-control form-control-lg"
                      placeholder="ex: adrianfl24 sau email@yahoo.com"
                      required
                    />
                  </div>
                  <div class="mb-4">
                    <label class="form-label fw-semibold">Parolă</label>
                    <input
                      type="password"
                      name="parola"
                      class="form-control form-control-lg"
                      placeholder="••••••••"
                      required
                    />
                  </div>
                  <button
                    type="submit"
                    class="btn btn-primary btn-lg w-100 fw-bold shadow-sm"
                  >
                    Intră în Cont
                  </button>
                </form>
              </div>

              <!-- TAB 2: FORMULAR ÎNREGISTRARE (REGISTER) -->
              <div class="tab-pane fade" id="register-panel">
                <form action="/register" method="post">
                  <div class="mb-3">
                    <label class="form-label fw-semibold"
                      >Nume Complet / Utilizator</label
                    >
                    <input
                      type="text"
                      name="nume"
                      class="form-control"
                      placeholder="ex: Popescu Maria sau adrianfl24"
                      required
                    />
                  </div>

                  <div class="mb-3">
                    <label class="form-label fw-semibold">Adresă Email</label>
                    <input
                      type="email"
                      name="email"
                      class="form-control"
                      placeholder="nume@domain.com"
                      required
                    />
                  </div>

                  <div class="mb-3">
                    <label class="form-label fw-semibold">Setează Parola</label>
                    <input
                      type="password"
                      name="parola"
                      class="form-control"
                      placeholder="••••••••"
                      required
                    />
                  </div>

                  <!-- Selectare Tip Cont / Rol -->
                  <div class="mb-4">
                    <label class="form-label fw-semibold"
                      >Alege ce fel de cont dorești:</label
                    >
                    <select
                      name="rol"
                      class="form-select form-select-lg border-primary"
                      required
                    >
                      <option value="PACIENT" selected>
                        👤 Cont Pacient (Solicită servicii la domiciliu)
                      </option>
                      <option value="MEDIC">
                        👨‍⚕️ Cont Medic / Cadru Medical (Oferă servicii)
                      </option>
                      <option value="ADMIN">
                        🛡️ Cont Administrator (Doar pentru admini)
                      </option>
                    </select>
                  </div>

                  <button
                    type="submit"
                    class="btn btn-success btn-lg w-100 fw-bold shadow-sm"
                  >
                    Creează Contul
                  </button>
                </form>
              </div>
            </div>
            <!-- End tab-content -->
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
