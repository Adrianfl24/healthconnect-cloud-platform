<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Autentificare - HealthConnect</title>
    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- FontAwesome Icons -->
    <link
      href="https://cdnjs.cloudflare.net/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
    <!-- Google Font: Plus Jakarta Sans -->
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --primary-blue: #0284c7;
        --primary-hover: #0369a1;
        --accent-cyan: #06b6d4;
        --bg-light: #f8fafc;
        --text-main: #0f172a;
        --text-muted: #475569;
      }

      html,
      body {
        height: 100%;
      }

      body {
        background-color: var(--bg-light);
        color: var(--text-main);
        font-family: "Plus Jakarta Sans", sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        overflow-x: hidden;
        /* Cromatică identică cu pagina principală */
        background-image:
          radial-gradient(
            circle at 15% 20%,
            rgba(56, 189, 248, 0.18) 0%,
            transparent 45%
          ),
          radial-gradient(
            circle at 85% 80%,
            rgba(14, 165, 233, 0.15) 0%,
            transparent 45%
          );
      }

      /* Header Navigation Identic cu Pagina Principală */
      .navbar-custom {
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid #e2e8f0;
        padding: 20px 0;
      }

      .brand-logo {
        font-size: 2rem;
        font-weight: 800;
        color: #0284c7;
      }

      .nav-link-custom {
        color: #334155;
        font-weight: 600;
        font-size: 1.15rem;
        margin: 0 15px;
        transition: color 0.2s;
      }

      .nav-link-custom:hover {
        color: var(--primary-blue);
      }

      /* Container Centrat cu Zoom pe Cardul de Autentificare */
      .auth-container {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
      }

      .auth-card-lg {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 32px;
        box-shadow: 0 25px 50px rgba(2, 132, 199, 0.15);
        width: 100%;
        max-width: 560px; /* Card mai lat și mai imponent */
        padding: 50px 45px;
      }

      .brand-title-lg {
        font-size: 2.2rem;
        font-weight: 900;
        color: var(--primary-blue);
      }

      /* Zoom pe Tab-uri */
      .nav-pills .nav-link {
        color: var(--text-muted);
        border-radius: 16px;
        font-weight: 700;
        font-size: 1.2rem;
        padding: 14px 24px;
        transition: all 0.3s ease;
      }

      .nav-pills .nav-link.active {
        background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
        color: #ffffff;
        box-shadow: 0 10px 25px rgba(2, 132, 199, 0.35);
      }

      /* Zoom pe Formular & Câmpuri */
      .form-label-lg {
        font-size: 1.05rem;
        font-weight: 700;
        color: #334155;
        margin-bottom: 8px;
      }

      .form-control-lg-custom,
      .form-select-lg-custom {
        background-color: #f8fafc;
        border: 1.5px solid #cbd5e1;
        color: var(--text-main);
        border-radius: 16px;
        padding: 16px 20px;
        font-size: 1.1rem;
        font-weight: 500;
      }

      .form-control-lg-custom:focus,
      .form-select-lg-custom:focus {
        background-color: #ffffff;
        border-color: var(--primary-blue);
        color: var(--text-main);
        box-shadow: 0 0 0 0.25rem rgba(2, 132, 199, 0.2);
      }

      /* Zoom pe Butonul Principal de Acțiune */
      .btn-action-lg {
        background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
        border: none;
        color: white;
        font-weight: 800;
        font-size: 1.3rem;
        border-radius: 60px;
        padding: 18px;
        transition: all 0.3s ease;
        box-shadow: 0 12px 30px rgba(2, 132, 199, 0.35);
      }

      .btn-action-lg:hover {
        transform: translateY(-3px) scale(1.01);
        box-shadow: 0 18px 40px rgba(2, 132, 199, 0.5);
        color: white;
      }

      .link-back-lg {
        color: var(--text-muted);
        font-weight: 700;
        font-size: 1.05rem;
        transition: color 0.2s;
      }

      .link-back-lg:hover {
        color: var(--primary-blue);
      }

      footer {
        background: #ffffff;
        border-top: 1px solid #e2e8f0;
      }
    </style>
  </head>
  <body>
    <!-- Header Navigation Identic (Elementele împinse la colțuri) -->
    <nav class="navbar navbar-expand-lg navbar-custom px-4 px-lg-5 py-3">
      <div
        class="container-fluid px-0 d-flex justify-content-between align-items-center"
      >
        <!-- Logo în colțul din STÂNGA -->
        <a
          class="navbar-brand brand-logo d-flex align-items-center gap-3 m-0"
          href="/"
        >
          <i class="fa-solid fa-heart-pulse text-info fs-1"></i> HealthConnect
        </a>

        <!-- Linkuri în colțul din DREAPTA -->
        <div class="d-none d-md-flex align-items-center gap-2">
          <a href="/#servicii" class="nav-link-custom text-decoration-none"
            >Servicii Medicale</a
          >
          <a href="/#despre" class="nav-link-custom text-decoration-none"
            >Despre Platformă</a
          >
          <a href="/#asistenta" class="nav-link-custom text-decoration-none"
            >Asistență 24/7</a
          >
        </div>
      </div>
    </nav>

    <!-- Zona Centrală cu Zoom pe Card -->
    <main class="auth-container">
      <div class="auth-card-lg">
        <!-- Titlu Card -->
        <div class="text-center mb-4">
          <div class="d-inline-flex align-items-center gap-2 mb-2">
            <i class="fa-solid fa-heart-pulse text-info fs-1"></i>
            <span class="brand-title-lg">HealthConnect</span>
          </div>
          <p class="text-muted fs-6 fw-semibold mb-0">
            Alege opțiunea dorită pentru a continua
          </p>
        </div>

        <!-- Tab-uri Mărite: Autentificare vs Înregistrare -->
        <ul
          class="nav nav-pills nav-justified mb-4 bg-light p-2 rounded-4"
          id="pills-tab"
          role="tablist"
        >
          <li class="nav-item" role="presentation">
            <button
              class="nav-link active"
              id="pills-login-tab"
              data-bs-toggle="pill"
              data-bs-target="#pills-login"
              type="button"
              role="tab"
            >
              <i class="fa-solid fa-lock me-2"></i> Autentificare
            </button>
          </li>
          <li class="nav-item" role="presentation">
            <button
              class="nav-link"
              id="pills-register-tab"
              data-bs-toggle="pill"
              data-bs-target="#pills-register"
              type="button"
              role="tab"
            >
              <i class="fa-solid fa-user-plus me-2"></i> Înregistrare
            </button>
          </li>
        </ul>

        <!-- Mesaj Eroare -->
        <div
          th:if="${error}"
          class="alert alert-danger py-3 bg-danger bg-opacity-10 border-danger text-danger text-center rounded-4 mb-4 fw-bold fs-6"
        >
          <i class="fa-solid fa-circle-exclamation me-1"></i> Date de
          autentificare incorecte!
        </div>

        <div class="tab-content" id="pills-tabContent">
          <!-- FORMULAR LOGIN -->
          <div
            class="tab-pane fade show active"
            id="pills-login"
            role="tabpanel"
          >
            <form action="/login" method="post">
              <div class="mb-4">
                <label class="form-label form-label-lg"
                  >Nume Utilizator / Email</label
                >
                <input
                  type="text"
                  name="username"
                  class="form-control form-control-lg-custom"
                  placeholder="ex: Popescu Maria sau email@domain.com"
                  required
                />
              </div>
              <div class="mb-4 pb-2">
                <label class="form-label form-label-lg">Parolă</label>
                <input
                  type="password"
                  name="parola"
                  class="form-control form-control-lg-custom"
                  placeholder="••••••••"
                  required
                />
              </div>
              <button type="submit" class="btn btn-action-lg w-100">
                Intră în Cont
              </button>
            </form>
          </div>

          <!-- FORMULAR ÎNREGISTRARE (Doar Pacient și Medic) -->
          <div class="tab-pane fade" id="pills-register" role="tabpanel">
            <form action="/register" method="post">
              <div class="mb-3">
                <label class="form-label form-label-lg"
                  >Nume Complet / Utilizator</label
                >
                <input
                  type="text"
                  name="nume"
                  class="form-control form-control-lg-custom"
                  placeholder="ex: Popescu Maria"
                  required
                />
              </div>
              <div class="mb-3">
                <label class="form-label form-label-lg">Adresă Email</label>
                <input
                  type="email"
                  name="email"
                  class="form-control form-control-lg-custom"
                  placeholder="nume@domeniu.com"
                  required
                />
              </div>
              <div class="mb-3">
                <label class="form-label form-label-lg">Parolă</label>
                <input
                  type="password"
                  name="parola"
                  class="form-control form-control-lg-custom"
                  placeholder="••••••••"
                  required
                />
              </div>
              <div class="mb-4">
                <label class="form-label form-label-lg">Tip Cont</label>
                <select
                  name="rol"
                  class="form-select form-select-lg-custom"
                  required
                >
                  <option value="PACIENT" selected>
                    👤 Pacient (Solicită servicii)
                  </option>
                  <option value="MEDIC">👨‍⚕️ Medic / Cadru Medical</option>
                </select>
              </div>
              <button type="submit" class="btn btn-action-lg w-100">
                Creează Cont Nou
              </button>
            </form>
          </div>
        </div>

        <div class="text-center mt-4 pt-2">
          <a href="/" class="link-back-lg text-decoration-none">
            <i class="fa-solid fa-arrow-left me-2"></i> Înapoi la pagina
            principală
          </a>
        </div>
      </div>
    </main>

    <!-- Subsol (Footer) Identic -->
    <footer class="text-center py-4 text-muted fs-6">
      <div class="container-xl">
        © 2026 HealthConnect. Toate drepturile rezervate.
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
