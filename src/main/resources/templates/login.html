<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Autentificare - HealthConnect</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.net/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background-color: #0a0f1d;
        color: #e2e8f0;
        font-family: "Segoe UI", system-ui, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-image: radial-gradient(
          circle at 50% 30%,
          rgba(0, 210, 255, 0.1) 0%,
          transparent 60%
        );
      }

      .auth-card {
        background: rgba(18, 26, 47, 0.85);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 24px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        width: 100%;
        max-width: 480px;
        padding: 40px;
      }

      .nav-pills .nav-link {
        color: #94a3b8;
        border-radius: 12px;
        font-weight: 600;
        padding: 10px 20px;
        transition: all 0.3s ease;
      }

      .nav-pills .nav-link.active {
        background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
        color: #fff;
        box-shadow: 0 4px 15px rgba(0, 114, 255, 0.4);
      }

      .form-control,
      .form-select {
        background-color: rgba(10, 15, 29, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.15);
        color: #fff;
        border-radius: 12px;
        padding: 12px 16px;
      }

      .form-control:focus,
      .form-select:focus {
        background-color: rgba(10, 15, 29, 0.8);
        border-color: #00d2ff;
        color: #fff;
        box-shadow: 0 0 0 0.25rem rgba(0, 210, 255, 0.25);
      }

      .form-control::placeholder {
        color: #64748b;
      }

      .btn-action {
        background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
        border: none;
        color: white;
        font-weight: 700;
        border-radius: 12px;
        padding: 14px;
        transition: all 0.3s ease;
      }

      .btn-action:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(0, 114, 255, 0.4);
        color: white;
      }
    </style>
  </head>
  <body>
    <div class="auth-card">
      <!-- Header Card -->
      <div class="text-center mb-4">
        <a href="/" class="text-decoration-none">
          <h2 class="fw-bold text-white">
            <i class="fa-solid fa-heart-pulse text-info me-2"></i>HealthConnect
          </h2>
        </a>
        <p class="text-secondary small">
          Alege opțiunea dorită pentru a continua
        </p>
      </div>

      <!-- Navigation Tabs: Login vs Register -->
      <ul
        class="nav nav-pills nav-justified mb-4"
        id="pills-tab"
        role="tablist"
      >
        <li class="nav-item" role="presentation">
          <button
            class="nav-link active"
            id="pills-login-tab"
            data-bs-toggle="pill"
            data-bs-target="#pills-login"
            type="button"
            role="tab"
          >
            <i class="fa-solid fa-lock me-1"></i> Login
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button
            class="nav-link"
            id="pills-register-tab"
            data-bs-toggle="pill"
            data-bs-target="#pills-register"
            type="button"
            role="tab"
          >
            <i class="fa-solid fa-user-plus me-1"></i> Înregistrare
          </button>
        </li>
      </ul>

      <!-- Alert Eroare -->
      <div
        th:if="${error}"
        class="alert alert-danger py-2 bg-danger bg-opacity-20 border-danger text-danger text-center rounded-3 mb-3 small"
      >
        Date de autentificare incorecte!
      </div>

      <div class="tab-content" id="pills-tabContent">
        <!-- FORMULAR LOGIN -->
        <div class="tab-pane fade show active" id="pills-login" role="tabpanel">
          <form action="/login" method="post">
            <div class="mb-3">
              <label class="form-label small text-secondary"
                >Nume Utilizator / Email</label
              >
              <input
                type="text"
                name="username"
                class="form-control"
                placeholder="ex: adrianfl24 sau email@domain.com"
                required
              />
            </div>
            <div class="mb-4">
              <label class="form-label small text-secondary">Parolă</label>
              <input
                type="password"
                name="parola"
                class="form-control"
                placeholder="••••••••"
                required
              />
            </div>
            <button type="submit" class="btn btn-action w-100">
              Autentificare
            </button>
          </form>
        </div>

        <!-- FORMULAR ÎNREGISTRARE -->
        <div class="tab-pane fade" id="pills-register" role="tabpanel">
          <form action="/register" method="post">
            <div class="mb-3">
              <label class="form-label small text-secondary"
                >Nume Complet / Utilizator</label
              >
              <input
                type="text"
                name="nume"
                class="form-control"
                placeholder="ex: Popescu Maria sau adrianfl24"
                required
              />
            </div>
            <div class="mb-3">
              <label class="form-label small text-secondary"
                >Adresă Email</label
              >
              <input
                type="email"
                name="email"
                class="form-control"
                placeholder="nume@domeniu.com"
                required
              />
            </div>
            <div class="mb-3">
              <label class="form-label small text-secondary">Parolă</label>
              <input
                type="password"
                name="parola"
                class="form-control"
                placeholder="••••••••"
                required
              />
            </div>
            <div class="mb-4">
              <label class="form-label small text-secondary"
                >Ce fel de cont dorești?</label
              >
              <select name="rol" class="form-select" required>
                <option value="PACIENT" selected>
                  👤 Pacient (Solicită servicii)
                </option>
                <option value="MEDIC">👨‍⚕️ Medic / Cadru Medical</option>
                <option value="ADMIN">🛡️ Admin (Sistem)</option>
              </select>
            </div>
            <button type="submit" class="btn btn-action w-100">
              Creează Cont Nou
            </button>
          </form>
        </div>
      </div>

      <div class="text-center mt-4">
        <a href="/" class="text-secondary small text-decoration-none"
          ><i class="fa-solid fa-arrow-left me-1"></i> Înapoi la pagina
          principală</a
        >
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
