<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Autentificare - HealthConnect</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light d-flex align-items-center vh-100">
    <div class="container" style="max-width: 450px">
      <div class="card shadow border-0 p-4">
        <h3 class="fw-bold text-center text-primary mb-4">🏥 HealthConnect</h3>

        <ul
          class="nav nav-pills nav-justified mb-3"
          id="pills-tab"
          role="tablist"
        >
          <li class="nav-item">
            <button
              class="nav-link active"
              id="login-tab"
              data-bs-toggle="pill"
              data-bs-target="#login"
            >
              Autentificare
            </button>
          </li>
          <li class="nav-item">
            <button
              class="nav-link"
              id="register-tab"
              data-bs-toggle="pill"
              data-bs-target="#register"
            >
              Înregistrare
            </button>
          </li>
        </ul>

        <div class="tab-content" id="pills-tabContent">
          <!-- Login -->
          <div class="tab-pane fade show active" id="login">
            <form action="/login" method="post">
              <div class="mb-3">
                <label class="form-label">Email</label>
                <input
                  type="email"
                  name="email"
                  class="form-control"
                  required
                />
              </div>
              <div class="mb-3">
                <label class="form-label">Parolă</label>
                <input
                  type="password"
                  name="parola"
                  class="form-control"
                  required
                />
              </div>
              <button type="submit" class="btn btn-primary w-100">
                Intră în cont
              </button>
            </form>
          </div>

          <!-- Register -->
          <div class="tab-pane fade" id="register">
            <form action="/register" method="post">
              <div class="mb-3">
                <label class="form-label">Nume Complet</label>
                <input type="text" name="nume" class="form-control" required />
              </div>
              <div class="mb-3">
                <label class="form-label">Email</label>
                <input
                  type="email"
                  name="email"
                  class="form-control"
                  required
                />
              </div>
              <div class="mb-3">
                <label class="form-label">Parolă</label>
                <input
                  type="password"
                  name="parola"
                  class="form-control"
                  required
                />
              </div>
              <div class="mb-3">
                <label class="form-label">Rolul tău</label>
                <select name="rol" class="form-select" required>
                  <option value="PACIENT">Pacient</option>
                  <option value="MEDIC">Medic / Cadru Medical</option>
                </select>
              </div>
              <button type="submit" class="btn btn-success w-100">
                Creează Cont
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
