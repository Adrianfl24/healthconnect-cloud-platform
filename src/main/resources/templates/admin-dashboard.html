<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Panou Administrator - HealthConnect</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-dark bg-dark shadow-sm mb-4">
      <div class="container">
        <a class="navbar-brand fw-bold" href="#"
          >🛡️ HealthConnect - Panou Administrator (adrianfl24)</a
        >
        <a href="/" class="btn btn-outline-light btn-sm">Deconectare</a>
      </div>
    </nav>

    <div class="container">
      <div class="alert alert-success fw-bold shadow-sm">
        Atenție: Ești conectat ca ADMINISTRATOR Suprem! Ai acces complet la baza
        de date din Azure.
      </div>

      <div class="row g-4 mt-2">
        <div class="col-md-4">
          <div class="card p-3 shadow-sm border-0 text-center">
            <h5 class="text-secondary">Total Pacienți</h5>
            <h2 class="fw-bold text-primary" th:text="${totalPacienti}">0</h2>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card p-3 shadow-sm border-0 text-center">
            <h5 class="text-secondary">Total Medici</h5>
            <h2 class="fw-bold text-success" th:text="${totalMedici}">0</h2>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card p-3 shadow-sm border-0 text-center">
            <h5 class="text-secondary">Total Programări</h5>
            <h2 class="fw-bold text-warning" th:text="${totalProgramari}">0</h2>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
